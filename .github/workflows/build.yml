# Fabrica las apps de Onda en la nube de GitHub:
#   - Onda-Android.apk          (celular Android)
#   - Onda-Windows-Setup.exe    (instalador para Windows)
# Se ejecuta al subir una etiqueta tipo v1.0.0, o a mano desde la pestaña "Actions".
name: Construir apps de Onda

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Preparar archivos de la app
        run: node scripts/prepare-www.js

      - name: Instalar Capacitor (versión compatible con el plugin de música)
        run: |
          npm install --no-audit --no-fund --omit=dev --legacy-peer-deps @capgo/capacitor-media-session@latest
          CAPV=$(node -p "((require('@capgo/capacitor-media-session/package.json').peerDependencies||{})['@capacitor/core']||'8').match(/[0-9]+/)[0]")
          echo "Usando Capacitor $CAPV"
          npm install --no-audit --no-fund --omit=dev --legacy-peer-deps \
            @capgo/capacitor-media-session@latest \
            @capacitor/core@$CAPV @capacitor/cli@$CAPV @capacitor/android@$CAPV @capacitor/app@$CAPV

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.js

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx --yes @capacitor/assets@latest generate --android --iconBackgroundColor "#0d0e12" --iconBackgroundColorDark "#0d0e12" --splashBackgroundColor "#0d0e12" --splashBackgroundColorDark "#0d0e12"

      - name: Sincronizar
        run: npx cap sync android

      - name: Usar siempre la misma firma (para poder actualizar sin perder tu música)
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Onda-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Android
          path: Onda-Android.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Onda-Android.apk

  windows:
    name: App Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar archivos de la app
        run: node scripts/prepare-www.js

      - name: Instalar Electron
        run: npm install --no-audit --no-fund

      - name: Crear instalador
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Windows
          path: dist/Onda-Windows-Setup.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Onda-Windows-Setup.exe
