<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onda">
<title>Onda — tu música</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0d0e12;--s1:#15171d;--s2:#1d2028;--s3:#272b35;--ln:#2a2e38;
  --tx:#f2f2f5;--tx2:#a3a7b3;--tx3:#6c7180;
  --ac:#ff7a45;--ac2:#ffb347;--acd:#ff7a4522;
  --r:12px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:currentColor;flex:none;display:block}
[hidden]{display:none!important}

#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr auto;height:100dvh}
/* Sidebar */
#side{background:#000;padding:18px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;padding:4px 10px 18px;letter-spacing:-.5px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center}
.logo i svg{width:20px;height:20px;color:var(--ink)}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--tx2);font-weight:600;width:100%;text-align:left}
.nav:hover{color:var(--tx);background:var(--s1)}
.nav.on{color:var(--tx);background:var(--s2)}
.sec{display:flex;align-items:center;justify-content:space-between;color:var(--tx3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:18px 12px 6px}
.sec button{color:var(--tx2);border-radius:6px;padding:2px}.sec button:hover{color:var(--tx);background:var(--s2)}
.sec svg{width:18px;height:18px}
.pl{padding:7px 12px;border-radius:8px;color:var(--tx2);width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl:hover{color:var(--tx);background:var(--s1)}.pl.on{color:var(--tx);background:var(--s2)}
.side-foot{margin-top:auto;padding:14px 12px 0;display:flex;flex-direction:column;gap:8px}
.store{font-size:12px;color:var(--tx3)}

/* Main */
@property --glow{syntax:'<color>';inherits:true;initial-value:#23262f}
@property --dyn{syntax:'<color>';inherits:true;initial-value:#3a3f4d}
#main{overflow:auto;position:relative;background:var(--bg)}
#glow{position:absolute;left:0;right:0;top:0;height:440px;background:linear-gradient(180deg,var(--glow) 0,transparent 100%);transition:--glow .9s ease;pointer-events:none;opacity:.9}
#content{position:relative}
#content.fade{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 22px 12px;background:#0d0e12cc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#back{width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:999px;padding:0 14px;height:40px;border:1px solid transparent}
.search:focus-within{border-color:var(--tx3)}
.search svg{color:var(--tx3);width:20px;height:20px}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
#content{padding:10px 22px 40px;position:relative}

.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:700;background:var(--s3);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--ln)}
.btn.danger{background:#e5484d;color:#fff}
.btn svg{width:20px;height:20px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.ib:hover{color:var(--tx);background:#ffffff12}
.ib.on{color:var(--ac)}

.hero{display:flex;align-items:flex-end;gap:22px;padding:20px 0 22px}
.hero .cv{width:180px;height:180px;border-radius:10px;box-shadow:0 10px 40px #0008}
.hero .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
.hero h1{font-size:clamp(28px,5vw,52px);margin:4px 0 6px;letter-spacing:-1px;line-height:1.05;word-break:break-word}
.hero .meta{color:var(--tx2);font-size:14px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bigplay{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 20px var(--acg)}
.bigplay svg{width:28px;height:28px}
.bigplay:hover{transform:scale(1.05)}
.sort{margin-left:auto;background:var(--s2);border:0;border-radius:8px;padding:8px 10px;color:var(--tx2)}

/* Cover */
.cv{object-fit:cover;background:var(--s3);border-radius:6px;display:grid;place-items:center;flex:none;overflow:hidden}
.cv.ph{background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 50) 60% 22%));color:#ffffffaa}
.cv.sm{width:42px;height:42px;border-radius:5px}.cv.sm svg{width:20px;height:20px}
.cv.md{width:100%;aspect-ratio:1;border-radius:8px}.cv.md svg{width:38%;height:38%}
.hero .cv svg,.np-cover .cv svg{width:40%;height:40%}

/* Rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px 42px minmax(0,1fr) minmax(0,.7fr) 36px 52px 36px;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none}
.row:hover{background:#ffffff0d}
.row .ri{color:var(--tx3);text-align:center;font-variant-numeric:tabular-nums;font-size:14px;display:grid;place-items:center}
.row .eq{display:none}
.row.cur .num{display:none}.row.cur .eq{display:flex}
.row .hp{display:none}.row .hp svg{width:16px;height:16px;color:var(--tx)}
.row:hover:not(.cur) .num{display:none}.row:hover:not(.cur) .hp{display:block}
.fav.pop svg,.ib.pop svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.marq{overflow:hidden;white-space:nowrap}
.marq .mi{display:inline-flex}.marq .mi>span{padding-right:48px}
.marq.run .mi{animation:marq var(--d,12s) linear infinite}
@keyframes marq{0%,12%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.row.cur .t1{color:var(--ac)}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2,.ra{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{color:var(--tx3);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row .fav{opacity:0}.row:hover .fav,.row .fav.on{opacity:1}
.eq{gap:2px;align-items:flex-end;height:14px}
.eq b{width:3px;background:var(--ac);border-radius:1px;height:30%;animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}
body.playing .eq b{animation-play-state:running}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:#ffffff08;border-radius:10px;padding:12px;cursor:pointer;text-align:left;transition:background .2s;position:relative}
.cvw{position:relative}
.fab{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 20px #000a;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.fab svg{width:24px;height:24px}
.card:hover .fab{opacity:1;transform:none}
.fab:hover{transform:scale(1.07)!important}
@media (hover:none){.fab{display:none}}
.card:hover{background:var(--s2)}
.card .t1{margin-top:10px}
.card.round .cv{border-radius:50%}
h2.ttl{font-size:26px;margin:14px 0 16px;letter-spacing:-.5px}

/* Empty */
.empty{max-width:520px;margin:6vh auto;text-align:center;padding:40px 24px;border:2px dashed var(--ln);border-radius:20px}
.empty .big{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:var(--ink)}
.empty .big svg{width:40px;height:40px}
.empty h2{margin:0 0 8px}.empty p{color:var(--tx2);margin:0 0 22px}
.empty .actions{justify-content:center}
.drop-on #main::after{content:"Suelta aquí tus canciones";position:fixed;inset:16px;border:3px dashed var(--ac);border-radius:20px;background:#0d0e12dd;display:grid;place-items:center;font-size:24px;font-weight:700;z-index:50}

/* Player bar */
#bar{grid-column:1/-1;background:#000;border-top:1px solid #1c1e25;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:10px 16px calc(10px + var(--safe-b));position:relative;min-height:84px}
.b-left{display:flex;align-items:center;gap:12px;min-width:0}
.b-left .cv{width:56px;height:56px;cursor:pointer}
.b-left .info{min-width:0;cursor:pointer}
.b-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctrls{display:flex;align-items:center;gap:10px}
.pp{width:40px;height:40px;border-radius:50%;background:var(--tx);color:#000;display:grid;place-items:center}
.pp:hover{transform:scale(1.06)}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.prog span{width:40px;text-align:center}
.b-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.vol{width:110px}
.ib.mode{position:relative}
.ib.mode.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--ac);transform:translateX(-50%)}
.mini-only{display:none}
.mini-prog{display:none}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--tx) var(--p,0%),var(--s3) var(--p,0%));outline:0;cursor:pointer;margin:0}
input[type=range]:hover{background:linear-gradient(to right,var(--ac) var(--p,0%),var(--s3) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}

/* Bottom nav (mobile) */
#bnav{display:none}

/* Now playing */
#np{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,var(--dyn) 0%,#121318 78%);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1),--dyn .9s ease;overflow-y:auto;overscroll-behavior:contain}
#np.open{transform:none}
#np .np-in{position:relative;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:calc(14px + var(--safe-t)) 24px calc(24px + var(--safe-b))}
.np-cover .cv{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body:not(.playing) .np-cover .cv{transform:scale(.9)}
.np-row{display:flex;justify-content:space-between;margin-top:14px}
.lcard{max-width:472px;width:calc(100% - 48px);margin:0 auto calc(40px + var(--safe-b));background:var(--dyn);border-radius:16px;padding:16px 18px 20px;cursor:pointer;box-shadow:0 12px 30px #0006;transition:--dyn .9s ease,transform .2s}
.lcard:active{transform:scale(.98)}
.lcard h4{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.lcard h4 small{font-weight:600;color:#ffffffb0;font-size:12px}
.lcard .ll{font-size:22px;margin:0 0 8px;pointer-events:none}
#lyr{position:fixed;inset:0;z-index:48;background:var(--dyn);display:flex;flex-direction:column;opacity:0;transform:translateY(40px);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1),--dyn .9s ease}
#lyr.open{opacity:1;transform:none;pointer-events:auto}
#lyr::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#0007);pointer-events:none}
.lyr-head{position:relative;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 6px;text-align:center}
.lyr-meta{flex:1;min-width:0}
.lyr-head .ib{color:#fff}
#lyrBody{position:relative;flex:1;overflow-y:auto;padding:14vh max(24px,calc(50% - 420px)) 42vh;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 82%,transparent 100%)}
.ll{font-size:clamp(24px,4vw,38px);font-weight:800;line-height:1.28;margin:0 0 .55em;color:#ffffff5c;cursor:pointer;transition:color .4s ease;letter-spacing:-.3px;word-break:break-word}
.ll:hover{color:#ffffffcc}
.ll.past{color:#ffffffb8}
.ll.cur{color:#fff}
.lnote{font-size:13px;font-weight:700;color:#ffffffb0;margin-bottom:22px;text-transform:uppercase;letter-spacing:1px}
.lmsg{text-align:center;font-size:20px;font-weight:700;color:#fffffff0;margin-top:8vh;line-height:1.5}
.lmsg small{display:block;font-size:14px;font-weight:500;color:#ffffffb0;margin-top:8px}
.lyr-foot{position:relative;max-width:640px;width:100%;margin:0 auto;padding:6px 20px calc(16px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:6px}
#lyr .prog{color:#ffffffc0}
#lyr input[type=range],.lcard input[type=range]{background:linear-gradient(to right,#fff var(--p,0%),#ffffff40 var(--p,0%))}
#lyr .ib{color:#fff}
.ib.act{color:var(--ac)}
.dlg textarea{background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;outline:0;font:14px/1.5 ui-monospace,monospace;resize:vertical;min-height:180px}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--tx)!important}
.chk input{width:20px;height:20px;accent-color:var(--ac)}
.np-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
.np-cover{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0;min-height:0}
.np-cover .cv{width:min(100%,46vh);height:auto;aspect-ratio:1;border-radius:14px;box-shadow:0 20px 60px #000a}
.np-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.np-meta>div{flex:1;min-width:0}
.np-meta .t1{font-size:22px}.np-meta .t2{font-size:15px}
.np-prog{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.np-prog .tm{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.np-ctrls{display:flex;align-items:center;justify-content:space-between}
.np-ctrls .ib svg{width:28px;height:28px}
.np-ctrls .ib{width:52px;height:52px}
.np-ctrls .pp{width:70px;height:70px}.np-ctrls .pp svg{width:34px;height:34px}
.np-ctrls .ib.mode svg{width:24px;height:24px}

/* Queue drawer */
#queue{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:45;background:var(--s1);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column}
#queue.open{transform:none}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--safe-t)) 16px 10px}
.q-head h3{margin:0}
#qlist{flex:1;overflow:auto;padding:0 8px calc(16px + var(--safe-b))}
.qrow{display:grid;grid-template-columns:42px minmax(0,1fr) 36px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.qrow:hover{background:#ffffff0d}
.qrow.cur .t1{color:var(--ac)}
.qrow.past{opacity:.45}
.qlab{font-size:12px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:12px 8px 6px}

/* Menu / modal / toast */
#menu{position:fixed;z-index:60;min-width:220px;max-width:290px;max-height:70vh;overflow:auto;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:5px;box-shadow:0 14px 40px #000a}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu button:hover{background:var(--s3)}
#menu button.danger{color:#ff6b6b}
#menu hr{border:0;border-top:1px solid var(--ln);margin:4px 0}
#menu .mh{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 12px 4px}
#modal{position:fixed;inset:0;z-index:70;background:#000a;display:grid;place-items:center;padding:20px}
.dlg{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0 0 4px}.dlg p{margin:0;color:var(--tx2);line-height:1.5}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--tx2)}
.dlg input{background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;outline:0;font-size:15px}
.dlg input:focus{border-color:var(--ac)}
.dlg-b{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.dlg ol{margin:0;padding-left:20px;color:var(--tx2);line-height:1.6}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:var(--tx);color:#000;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 24px #0008;max-width:90vw;text-align:center}


/* ====== Tema por estación ====== */
:root{--ink:#2a0c03;--acg:#ff7a4544;--tint:#2b1810}
body{background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--tint) 70%,transparent),transparent 60%),var(--bg)}
#app{background:transparent}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib.live{color:var(--ac)}
.ib.live::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 2px var(--bg)}
.ib{position:relative}

/* ====== Barra lateral (escritorio) estilo Spotify ====== */
#side{background:transparent;padding:8px;gap:8px}
.side-card{background:#0f1015;border-radius:12px;padding:10px 8px}
.side-card .logo{padding:6px 10px 12px}
.side-lib{flex:1;display:flex;flex-direction:column;min-height:0}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.lib-head .nav{font-size:15px}
#sideList{flex:1;overflow:auto;margin:4px -4px 0;padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:999px;background:#ffffff14;font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.chip:hover{background:#ffffff22}
.chip.on{background:var(--tx);color:#000}
.li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;text-align:left;width:100%}
.li:hover{background:#ffffff0f}
.li.on{background:#ffffff14}
.li .cv{width:48px;height:48px;border-radius:6px}
.li.round .cv{border-radius:50%}
.li .t2{font-size:12.5px}
.li .cv svg{width:22px;height:22px}
.favtile{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink)!important;display:grid;place-items:center}

/* ====== Inicio ====== */
.greet{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.greet h1{font-size:clamp(24px,3.4vw,32px);margin:0;letter-spacing:-.6px}
.greet .top-r{display:none}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:26px}
.qt{display:flex;align-items:center;gap:12px;background:#ffffff12;border-radius:8px;overflow:hidden;height:56px;cursor:pointer;text-align:left;transition:background .2s;position:relative}
.qt:hover{background:#ffffff22}
.qt .cv{width:56px;height:56px;border-radius:0}
.qt .cv svg{width:24px;height:24px}
.qt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.shelf-h h2{margin:0;font-size:22px;letter-spacing:-.4px}
.shelf-h small{color:var(--tx2);font-weight:600;cursor:pointer}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,176px);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.shelf .card{padding:10px}
.netcard .t2 small{color:var(--ac)}
.skel{background:linear-gradient(90deg,#ffffff0d,#ffffff1a,#ffffff0d);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* Banner de estación con partículas */
.season{position:relative;overflow:hidden;border-radius:16px;padding:18px 20px;margin-bottom:22px;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 38%,#000),color-mix(in srgb,var(--ac2) 30%,#000));min-height:96px;display:flex;align-items:flex-end}
.season small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;opacity:.85}
.season b{font-size:20px;letter-spacing:-.3px}
.season .fx{position:absolute;inset:0;pointer-events:none}
.season .fx i{position:absolute;top:-12px;display:block;border-radius:50%;opacity:.85;animation:fall linear infinite}
.s-invierno .fx i{width:6px;height:6px;background:#fff}
.s-primavera .fx i{width:10px;height:7px;background:#ffc2dd;border-radius:60% 0 60% 0}
.s-verano .fx i{width:5px;height:5px;background:#fff3b0;box-shadow:0 0 10px #ffe066;animation-name:rise;top:auto;bottom:-10px}
.s-otono .fx i{width:11px;height:11px;background:#ffb35c;border-radius:0 70% 0 70%}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(140px) translateX(30px) rotate(320deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}30%{opacity:1}to{transform:translateY(-130px);opacity:0}}

/* ====== Buscar ====== */
.explore{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gtile{position:relative;height:100px;border-radius:10px;overflow:hidden;padding:14px;font-weight:800;font-size:18px;text-align:left;cursor:pointer;color:#fff;transition:transform .2s}
.gtile:hover{transform:scale(1.03)}
.gtile i{position:absolute;right:-14px;bottom:-14px;width:72px;height:72px;border-radius:8px;transform:rotate(25deg);background:#ffffff30;box-shadow:0 6px 20px #0005}
.best{display:flex;flex-direction:column;gap:14px;background:#ffffff0d;border-radius:12px;padding:20px;cursor:pointer;transition:background .2s;position:relative}
.best:hover{background:#ffffff18}
.best .cv{width:96px;height:96px;border-radius:8px;box-shadow:0 8px 24px #0007}
.best h3{margin:0;font-size:26px}
.sgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:22px}
.netrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 8px;border-radius:8px}
.netrow:hover{background:#ffffff0d}
.netrow .cv{width:48px;height:48px;border-radius:6px}
.netrow .acts{display:flex;align-items:center;gap:2px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:4px;background:#ffffff1a;color:var(--tx2);margin-right:6px;vertical-align:1px}
.badge.free{background:color-mix(in srgb,#3ddc84 22%,transparent);color:#7ff0b0}
.note{font-size:13px;color:var(--tx3);margin:8px 0 0}

/* ====== Biblioteca ====== */
.libbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.libbar h1{margin:0;font-size:26px;letter-spacing:-.5px}
.libtools{display:flex;align-items:center;justify-content:space-between;margin:6px 0 6px;color:var(--tx2);font-size:13px;font-weight:600}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}

/* ====== Reproduciendo: estilos ====== */
#npWall{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s,background-image .6s;pointer-events:none;animation:kb 26s ease-in-out infinite alternate}
#npWall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0009 0%,#0000 22%,#0000 45%,color-mix(in srgb,var(--dyn) 55%,#000) 78%,#000 100%)}
#np.wall #npWall{opacity:1}
#np.wall{background:#000}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,-1%)}}
.np-head .np-from{text-align:center;min-width:0;flex:1}
.np-head .np-from small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#ffffffb0;font-weight:700}
.np-head .np-from b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-stage{flex:1;min-height:240px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;margin:10px 0 4px}
.np-stage img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.np-stage{-webkit-touch-callout:none}
.np-slot{position:absolute;inset:0}
.np-item{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.np-art{width:min(100%,46vh);aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 24px 60px #000b;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body:not(.playing) .np-art{transform:scale(.9)}
.np-stage.grab .np-item>*{box-shadow:0 40px 90px #000e,0 0 0 3px color-mix(in srgb,var(--ac) 70%,transparent)}
.vwrap{position:relative;width:min(100%,46vh);aspect-ratio:1}
.vinyl{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#0b0b0b 0 31%,#151515 31.5% 32.5%,#0b0b0b 33%),#0b0b0b;box-shadow:0 25px 60px #000d,inset 0 0 0 3px #1c1c1c;animation:spin 3.6s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,#0000 0 2px,#ffffff0a 2.4px 3px)}
body.playing .vinyl{animation-play-state:running}
.vinyl .label{position:absolute;inset:32%;width:36%;height:36%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #0008}
.vinyl .label.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0008}
.vinyl .hole{position:absolute;left:48.6%;top:48.6%;width:2.8%;height:2.8%;border-radius:50%;background:#000;box-shadow:0 0 0 2px #333}
.vwrap .shine{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#fff0,#ffffff1c 8%,#fff0 18%,#fff0 50%,#ffffff14 58%,#fff0 68%);pointer-events:none}
.arm{position:absolute;right:-6%;top:-6%;width:38%;height:auto;transform-origin:78% 14%;transform:rotate(-28deg);transition:transform .8s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 8px 10px #0009)}
body.playing .arm{transform:rotate(0deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.np-dots{display:flex;justify-content:center;gap:7px;margin:2px 0 14px}
.np-dots button{width:7px;height:7px;border-radius:999px;background:#ffffff55;transition:width .3s,background .3s}
.np-dots button.on{width:22px;background:#fff}
.np-conn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:#ffffffd0;background:#ffffff14;border-radius:999px;padding:6px 12px;margin:8px auto 0;max-width:100%;transition:background .2s,transform .2s}
.np-conn .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 #3ddc84aa;animation:ping 1.8s infinite}
.np-conn.hot{background:color-mix(in srgb,var(--ac) 60%,transparent);transform:scale(1.06);color:#fff}
@keyframes ping{70%{box-shadow:0 0 0 8px #3ddc8400}100%{box-shadow:0 0 0 0 #3ddc8400}}
#np.incoming .np-item{animation:incoming .8s cubic-bezier(.2,.9,.2,1.1)}
@keyframes incoming{from{transform:translateY(-90vh) scale(.5) rotate(10deg);opacity:0}to{transform:none;opacity:1}}
.np-meta .t2{cursor:pointer}
.np-meta .t2:hover{text-decoration:underline}
.b-left .cv.swap,.b-left .info.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{transform:translateY(10px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.np-row .grp{display:flex;gap:4px}

/* ====== Hojas laterales: info de canción ====== */
#info{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:46;background:var(--s1);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#info.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 12px 8px}
.sheet-head b{font-size:15px}
#infoBody{flex:1;overflow:auto;padding:0 18px calc(30px + var(--safe-b))}
.ihero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:16px}
.ihero img,.ihero .cv{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:0}
.ihero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,#000d)}
.ihero .cap h2{margin:0;font-size:24px;letter-spacing:-.4px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.facts span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#ffffff14;color:var(--tx2)}
.isec{background:#ffffff0a;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.isec h4{margin:0 0 8px;font-size:15px}
.isec p{margin:0;color:var(--tx2);line-height:1.55;font-size:14px}
.isec a{color:var(--ac);font-weight:600;text-decoration:none;font-size:13px}
.artist-pic{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.artist-pic img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.linkbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.linkbtns a{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:#ffffff14;color:var(--tx);text-decoration:none;font-size:13px;font-weight:700}

/* ====== Conectar dispositivos ====== */
.conn-code{text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,#000),color-mix(in srgb,var(--ac2) 25%,#000));border-radius:14px;padding:16px}
.conn-code b{display:block;font-size:34px;letter-spacing:6px;margin:4px 0;font-variant-numeric:tabular-nums}
.conn-code small{color:#ffffffb0}
.devs{display:flex;flex-direction:column;gap:6px}
.dev{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:10px;padding:8px 10px;font-size:14px}
.dev .st{width:9px;height:9px;border-radius:50%;background:var(--tx3)}
.dev .st.on{background:#3ddc84}
.dev button{margin-left:auto;color:var(--tx3);font-size:12px}
.hint{font-size:13px;color:var(--tx2);line-height:1.5;margin:0}
.dlg{max-height:88vh;overflow:auto}
.dlg select{background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;color:var(--tx)}
.pick{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.pick label{display:grid!important;grid-template-columns:22px 40px minmax(0,1fr);align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;color:var(--tx)!important;font-size:14px!important}
.pick label:hover{background:#ffffff0d}
.pick input{width:18px;height:18px;accent-color:var(--ac);padding:0}
.pick .cv{width:40px;height:40px}
.fileitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--ln);font-size:14px}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
  #side{display:none}
  #top{padding:calc(10px + var(--safe-t)) 14px 10px}
  .search{max-width:none}
  #content{padding:6px 14px 24px}
  .row{grid-template-columns:42px minmax(0,1fr) 36px;gap:10px;padding:6px 4px}
  .row .ri,.row .ra,.row .rd,.row .fav{display:none}
  .row.cur .t1{color:var(--ac)}
  .hero{flex-direction:column;align-items:flex-start;gap:14px;padding:6px 0 14px}
  .hero .cv{width:min(62vw,240px);height:min(62vw,240px);align-self:center}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{padding:10px;background:transparent}
  #bar{grid-row:2;grid-template-columns:minmax(0,1fr) auto;margin:0 8px 6px;border-radius:10px;background:var(--s2);border:0;padding:8px 8px 8px 8px;min-height:0;gap:8px;overflow:hidden}
  #bar.empty-bar{display:none}
  .b-left .cv{width:42px;height:42px}
  .b-center,.b-right{display:none}
  .mini-only{display:flex;align-items:center}
  .mini-prog{display:block;position:absolute;left:10px;right:10px;bottom:0;height:2px;background:#ffffff22;border-radius:2px;overflow:hidden}
  .mini-prog i{display:block;height:100%;width:0;background:var(--tx)}
  #bar .b-left .fav{display:none}
  #bnav{grid-row:3;display:flex;justify-content:space-around;background:linear-gradient(180deg,transparent,#000 40%);padding:6px 4px calc(6px + var(--safe-b))}
  #bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx3);flex:1;padding:4px 0}
  #bnav button.on{color:var(--tx)}
  #toast{bottom:150px}
}

@media (max-width:760px){
  body:not([data-view=search]):not(.has-back) #top{display:none}
  body.has-back:not([data-view=search]) #top .search{display:none}
  #top .top-r{display:none}
  .greet .top-r{display:flex}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qt{height:52px}.qt .cv{width:52px;height:52px}
  .shelf{grid-auto-columns:42%;gap:12px}
  .shelf .card{padding:0;background:transparent}
  .sgrid{grid-template-columns:1fr}
  .explore{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gtile{height:92px;font-size:16px}
  .libgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #content{padding-top:calc(8px + var(--safe-t))}
  body[data-view=search] #content,body.has-back #content{padding-top:6px}
  #bnav{justify-content:space-around}
  #info{width:100%;top:auto;height:92dvh;border-radius:18px 18px 0 0;border-left:0;transform:translateY(100%)}
  #info.open{transform:none}
  .np-stage{min-height:200px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-card">
      <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg></i>Onda</div>
      <button class="nav" data-act="nav" data-v="home" data-ic="home">Inicio</button>
      <button class="nav" data-act="nav" data-v="search" data-ic="search">Buscar</button>
    </div>
    <div class="side-card side-lib">
      <div class="lib-head"><button class="nav" data-act="nav" data-v="library" data-ic="lib" style="width:auto;padding:6px 8px">Tu biblioteca</button><button class="ib" data-act="create" data-ic="plus" title="Crear"></button></div>
      <div class="chips" id="sideChips"></div>
      <div id="sideList"></div>
      <div class="side-foot"><div class="store" id="store"></div></div>
    </div>
  </aside>

  <main id="main">
    <div id="glow"></div>
    <div id="top">
      <button id="back" data-act="back" data-ic="back" hidden></button>
      <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off"></label>
      <div class="top-r">
        <button class="btn ghost sm" data-act="install" id="installBtn">Instalar app</button>
        <button class="ib" data-act="connect" data-ic="cast" title="Conectar dispositivos"></button>
        <button class="ib" data-act="settings" data-ic="gear" title="Ajustes"></button>
      </div>
    </div>
    <div id="content"></div>
  </main>

  <footer id="bar" class="empty-bar">
    <div class="b-left">
      <div id="bCover" data-act="opennp"></div>
      <div class="info" data-act="opennp"><div class="t1" id="bTitle">Nada sonando</div><div class="t2" id="bArtist">Elige una canción</div></div>
      <button class="ib fav" id="bFav" data-act="favcur"></button>
    </div>
    <div class="b-center">
      <div class="ctrls">
        <button class="ib mode" id="bShuf" data-act="shuffle" title="Aleatorio"></button>
        <button class="ib" data-act="prev" data-ic="prev" title="Anterior"></button>
        <button class="pp" id="bPlay" data-act="toggle" title="Reproducir/Pausa"></button>
        <button class="ib" data-act="next" data-ic="next" title="Siguiente"></button>
        <button class="ib mode" id="bRep" data-act="repeat" title="Repetir"></button>
      </div>
      <div class="prog"><span id="bCur">0:00</span><input type="range" id="bSeek" min="0" max="1000" value="0"><span id="bDur">0:00</span></div>
    </div>
    <div class="b-right">
      <button class="ib" data-act="info" data-ic="info" title="Sobre la canción"></button>
      <button class="ib" data-act="lyrics" id="bLyr" data-ic="mic" title="Letra"></button>
      <button class="ib" data-act="queue" data-ic="queue" title="Cola"></button>
      <button class="ib" data-act="connect" id="bConn" data-ic="cast" title="Conectar dispositivos"></button>
      <button class="ib" id="bMute" data-act="mute" title="Silenciar"></button>
      <input type="range" class="vol" id="bVol" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="mini-only">
      <button class="ib" id="mPlay" data-act="toggle"></button>
      <button class="ib" data-act="next" id="mNext" data-ic="next"></button>
    </div>
    <div class="mini-prog"><i id="mProg"></i></div>
  </footer>

  <nav id="bnav">
    <button data-act="nav" data-v="home" data-ic="home">Inicio</button>
    <button data-act="nav" data-v="search" data-ic="search">Buscar</button>
    <button data-act="nav" data-v="library" data-ic="lib">Tu biblioteca</button>
    <button data-act="create" data-ic="plus">Crear</button>
  </nav>
</div>

<section id="np" aria-hidden="true">
  <div id="npWall"></div>
  <div class="np-in">
    <div class="np-head"><button class="ib" data-act="closenp" data-ic="down"></button><div class="np-from"><small>Reproduciendo</small><b id="npFrom"></b></div><button class="ib" data-act="npmore" data-ic="more"></button></div>
    <button class="np-conn" id="npConn" data-act="connect" hidden></button>
    <div class="np-stage" id="npStage"><div class="np-slot" id="npSlot"></div></div>
    <div class="np-dots" id="npDots"></div>
    <div class="np-meta"><div><div class="t1 marq" id="npTitle"></div><div class="t2" id="npArtist" data-act="npartist"></div></div><button class="ib fav" id="npFav" data-act="favcur"></button></div>
    <div class="np-prog"><input type="range" id="npSeek" min="0" max="1000" value="0"><div class="tm"><span id="npCur">0:00</span><span id="npDur">0:00</span></div></div>
    <div class="np-ctrls">
      <button class="ib mode" id="npShuf" data-act="shuffle"></button>
      <button class="ib" data-act="prev" data-ic="prev"></button>
      <button class="pp" id="npPlay" data-act="toggle"></button>
      <button class="ib" data-act="next" data-ic="next"></button>
      <button class="ib mode" id="npRep" data-act="repeat"></button>
    </div>
    <div class="np-row">
      <div class="grp"><button class="ib" data-act="info" data-ic="info" title="Historia de la canción"></button><button class="ib" data-act="lyrics" id="npLyr" data-ic="mic" title="Letra"></button></div>
      <div class="grp"><button class="ib" data-act="npstyle" data-ic="style" title="Cambiar estilo"></button><button class="ib" data-act="connect" data-ic="cast" title="Conectar"></button><button class="ib" data-act="queue" data-ic="queue" title="Cola"></button></div>
    </div>
  </div>
  <div class="lcard" data-act="lyrics" id="lcard"></div>

function parseLyrics(txt,src){

    if(!tags.length)continue;
    const text=raw.replace(/\[[^\]]*\]/g,'').replace(/<\d+:\d+(?:\.\d+)?>/g,'').trim();
    for(const m of tags)lines.push({t:Math.max(0,+m[1]*60+parseFloat(m[2].replace(':','.'))-offset),s:text});
  }
  if(lines.length>=3){lines.sort((a,b)=>a.t-b.t);return{synced:lines,plain:null,src}}
  const plain=txt.replace(/\r/g,'').split('\n').filter(l=>!/^\[[a-z#]+:.*\]$/i.test(l.trim())).join('\n').trim();

const lyrLoading=new Set();
async function ensureLyrics(t,force){

async function findCoverOnline(t){
  const an=knownArtist(t),al=knownAlbum(t);
  const term=[an,al||cleanTitle(t.title)].filter(Boolean).join(' ');
  const j=await fetchJSON('https://itunes.apple.com/search?'+new URLSearchParams({term,media:'music',entity:al?'album':'song',limit:'3',country:'MX'}));
  let url=j&&!j.__err&&j.results?.[0]?.artworkUrl100?j.results[0].artworkUrl100.replace(/\d+x\d+bb/,'600x600bb'):null;
  if(!url){
    const q=`recording:"${cleanTitle(t.title)}"`+(an?` AND artist:"${an}"`:'');
    const m=await fetchJSON('https://musicbrainz.org/ws/2/recording/?fmt=json&limit=3&query='+encodeURIComponent(q));
    if(m?.__err&&j?.__err)return'err';
    const rel=m&&!m.__err&&(m.recordings||[]).flatMap(r=>r.releases||[])[0];
    if(rel)url=`https://coverartarchive.org/release/${rel.id}/front-500`;
  }
  if(!url)return null;
  try{const r=await fetch(url);if(r.ok){const b=await r.blob();if(b.type.startsWith('image/'))return{blob:b}}}catch{}
  return{url};
}
async function ensureCover(t){
  if(!t||t.cover||t.coverUrl||!online())return;
  if(t.coverChecked&&Date.now()-t.coverChecked<7*864e5)return;
  const r=await findCoverOnline(t);if(r==='err')return'err';
  const group=knownAlbum(t)?[...S.tracks.values()].filter(x=>albumKey(x)===albumKey(t)&&!x.cover&&!x.coverUrl):[t];
  for(const x of group){if(r?.blob)x.cover=r.blob;else if(r?.url)x.coverUrl=r.url;else x.coverChecked=Date.now();try{await dbPut('tracks',x)}catch{}}
  if(r){colorCache.delete(albumKey(t));if(group.some(x=>x.id===curId()))updateNow(true);scheduleRender()}
}
const coverQ=[];let coverBusy=false;
function queueMissingCovers(){
  if(!online())return;const seen=new Set();
  for(const t of S.tracks.values()){
    if(t.cover||t.coverUrl||(t.coverChecked&&Date.now()-t.coverChecked<7*864e5))continue;
    const k=knownAlbum(t)?albumKey(t):t.id;if(seen.has(k))continue;seen.add(k);coverQ.push(t.id);
  }
  runCoverQ();
}
async function runCoverQ(){
  if(coverBusy)return;coverBusy=true;
  while(coverQ.length){const t=S.tracks.get(coverQ.shift());if(t&&await ensureCover(t)==='err'){coverQ.length=0;break}await new Promise(r=>setTimeout(r,1100))}
  coverBusy=false;
}

const AUDIO_EXT='mp3|mp2|mpga|m4a|m4b|mp4|aac|flac|wav|wave|ogg|oga|opus|webm|weba|wma|aif|aiff|aifc|caf|amr|3gp|3ga|mka|ape|wv|alac|dsf|dff|ac3|mid|midi';
const AUDIO_RE=new RegExp('\\.('+AUDIO_EXT+')$','i');
const WANT_RE=new RegExp('\\.('+AUDIO_EXT+'|lrc|jpe?g|png|webp)$','i');
const EXT_MIME={mp3:'audio/mpeg',mp2:'audio/mpeg',mpga:'audio/mpeg',m4a:'audio/mp4',m4b:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',wave:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg; codecs=opus',webm:'audio/webm',weba:'audio/webm',wma:'audio/x-ms-wma',aif:'audio/aiff',aiff:'audio/aiff',aifc:'audio/aiff',caf:'audio/x-caf',amr:'audio/amr','3gp':'audio/3gpp','3ga':'audio/3gpp',mka:'audio/x-matroska',ape:'audio/ape',wv:'audio/wavpack',alac:'audio/mp4',dsf:'audio/dsd',dff:'audio/dsd',ac3:'audio/ac3',mid:'audio/midi',midi:'audio/midi'};
const extOf=n=>((String(n||'').match(/\.([a-z0-9]+)$/i)||[,''])[1]).toLowerCase();
const isAudio=f=>!/^\._/.test(f.name)&&(AUDIO_RE.test(f.name)||((f.type||'').startsWith('audio/')));
const pathOf=f=>f._path||f.webkitRelativePath||f.name;
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'';
const baseOf=p=>p.split('/').pop().replace(/\.[^.]+$/,'').toLowerCase();
const probe=document.createElement('audio');
async function importFiles(files,opts={}){
  const all=[...files].filter(f=>!/^\._/.test(f.name));

    if(/\.lrc$/i.test(f.name))lrcMap.set(dirOf(p)+'/'+baseOf(p),f);
    else if(/\.(jpe?g|png|webp)$/i.test(f.name)){const d=dirOf(p);if(!imgByDir.has(d))imgByDir.set(d,[]);imgByDir.get(d).push(f)}}
  const pickImg=d=>{const l=imgByDir.get(d);if(!l)return null;return l.find(f=>/^(cover|folder|front|album|albumart)/i.test(f.name))||l.find(f=>/cover|front|folder/i.test(f.name))||(l.length===1?l[0]:null)};
  const auds=all.filter(isAudio);
  if(!auds.length&&lrcMap.size){
    let n=0;
    for(const [k,lf] of lrcMap){const b=k.split('/').pop();const t=[...S.tracks.values()].find(t=>baseOf(t.file)===b);
      if(t){const L=parseLyrics(await lf.text(),'file');if(L){t.lyrics=L;try{await dbPut('tracks',t)}catch{}n++}}}
    toast(n?`Letra agregada a ${n} canci${n===1?'ón':'ones'}`:'Esas letras no coinciden con ninguna canción (el .lrc debe llamarse igual que la canción)',3500);
    if(curT())renderLyrics();return{found:0,added:0};
  }
  if(!auds.length){if(!opts.quiet)toast(all.length?`Revisé ${all.length} archivos y ninguno es de audio`:'No encontré archivos de audio ahí',3500);return{found:0,added:0}}
  try{await navigator.storage?.persist?.()}catch{}
  const rep={found:auds.length,added:0,dup:0,bad:[],quota:false};
  const queue=auds.slice();let done=0,seq=0;
  const one=async f=>{
    const id=f.name+'|'+f.size,p=pathOf(f),lf=lrcMap.get(dirOf(p)+'/'+baseOf(p));
    if(S.tracks.has(id)){
      const ex=S.tracks.get(id);
      if(lf&&!ex.lyrics?.synced){const L=parseLyrics(await lf.text(),'file');if(L){ex.lyrics=L;try{await dbPut('tracks',ex)}catch{}}}
      rep.dup++;return}
    const ext=extOf(f.name),mime=(f.type&&f.type.startsWith('audio/')?f.type:'')||EXT_MIME[ext]||'';
    const can=mime?probe.canPlayType(mime):'maybe';
    const [tg,dur]=await Promise.all([readTags(f),getDuration(f)]);
    if(!dur&&!can){rep.bad.push(f.name);return}
    const fb=parseName(f.name);
    let lyrics=null;
    if(lf)lyrics=parseLyrics(await lf.text(),'file');
    if(!lyrics&&tg.lyrics)lyrics=parseLyrics(tg.lyrics,'tag');
    const t={id,file:f.name,title:tg.title||fb.title,artist:tg.artist||fb.artist||'Artista desconocido',album:tg.album||'Sin álbum',
      track:tg.track||0,duration:dur,blob:f,cover:tg.cover||pickImg(dirOf(p))||null,lyrics,added:Date.now()+(seq++)};
    try{await dbPut('tracks',t)}catch(e){rep.quota=true;queue.length=0;return}

  const worker=async()=>{while(queue.length){const f=queue.shift();try{await one(f)}catch{rep.bad.push(f.name)}done++;
    if(auds.length>1)toast(`Agregando música… ${done} de ${auds.length}`,0);if(done%25===0)scheduleRender()}};
  await Promise.all(Array.from({length:Math.min(4,auds.length)},worker));
  render();updateStorage();queueMissingCovers();if(curT())renderLyrics();S.recos=null;
  if(opts.quiet){$('#toast').hidden=true;return rep}
  if(rep.bad.length||rep.quota){
    const byExt={};rep.bad.forEach(n=>{const e='.'+(extOf(n)||'?');byExt[e]=(byExt[e]||0)+1});
    modal({title:'Listo: así quedó tu música',ok:'',html:`<p class="hint">Encontré <b>${rep.found}</b> archivos de audio:</p>
      <div class="facts" style="margin:0"><span>✓ ${rep.added} agregadas</span>${rep.dup?`<span>${rep.dup} ya estaban</span>`:''}${rep.bad.length?`<span style="color:#ffb4a8">${rep.bad.length} no se pueden reproducir</span>`:''}</div>
      ${rep.bad.length?`<p class="hint">Este dispositivo no puede reproducir estos formatos: <b>${Object.entries(byExt).map(([e,n])=>`${e} (${n})`).join(', ')}</b>. Conviértelos a MP3, M4A o FLAC (por ejemplo con el programa gratis fre:ac o con VLC) y agrégalos de nuevo.</p>
      <div style="max-height:150px;overflow:auto;font-size:12.5px;color:var(--tx3)">${rep.bad.slice(0,200).map(esc).join('<br>')}</div>`:''}
      ${rep.quota?'<p class="hint" style="color:#ffb4a8">Se llenó el espacio disponible del dispositivo. Libera espacio y agrega el resto.</p>':''}`});
    $('#toast').hidden=true;
  }else toast(`${rep.added} ${rep.added===1?'canción agregada':'canciones agregadas'}`+(rep.dup?` · ${rep.dup} ya estaba${rep.dup===1?'':'n'}`:''),3500);
  return rep;
}
async function* walkDir(dir,pre=''){
  let it;try{it=dir.values()}catch{return}
  try{for await(const h of it){const p=pre+h.name;
    try{if(h.kind==='file'){if(WANT_RE.test(h.name)&&!/^\._/.test(h.name)){const f=await h.getFile();try{Object.defineProperty(f,'_path',{value:p})}catch{}yield f}}
      else if(!/^\./.test(h.name))yield* walkDir(h,p+'/')}catch{}}}catch{}
}

async function filesFromDrop(dt){
  const entries=[...dt.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length)return[...dt.files];
  const out=[];
  const walk=async e=>{if(e.isFile){try{const f=await new Promise((r,j)=>e.file(r,j));try{Object.defineProperty(f,'_path',{value:e.fullPath.replace(/^\//,'')})}catch{}out.push(f)}catch{}}else if(e.isDirectory){const rd=e.createReader();let b;do{b=await new Promise((r,j)=>rd.readEntries(r,j));for(const c of b)await walk(c)}while(b.length)}};
  for(const e of entries)await walk(e);return out;
}

function coverURL(t){if(!t)return null;if(!t.cover)return t.coverUrl||null;let u=covers.get(t.id);if(!u){u=URL.createObjectURL(t.cover);covers.set(t.id,u)}return u}

const albumKey=t=>t?t.album+'\u0001'+t.artist:'';
const colorCache=new Map();
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function getColor(t){return new Promise(res=>{
  if(!t)return res(null);const k=albumKey(t);if(colorCache.has(k))return res(colorCache.get(k));
  const u=coverURL(t);
  if(!u){const c=`hsl(${hue((t.album||'')+(t.artist||''))} 42% 30%)`;colorCache.set(k,c);return res(c)}
  const img=new Image();if(!u.startsWith('blob:'))img.crossOrigin='anonymous';
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,32,32);const d=x.getImageData(0,0,32,32).data;
    let r=0,g=0,b=0,w=0;for(let i=0;i<d.length;i+=4){const R=d[i],G=d[i+1],B=d[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),sat=mx?(mx-mn)/mx:0,l=(mx+mn)/510;
      const wt=.05+sat*sat*4*(l>.1&&l<.9?1:.05);r+=R*wt;g+=G*wt;b+=B*wt;w+=wt}
    const [h,s,l]=rgb2hsl(r/w,g/w,b/w);
    const col=`hsl(${Math.round(h)} ${Math.round(Math.min(68,Math.max(18,s*100)))}% ${Math.round(Math.min(38,Math.max(22,l*100)))}%)`;
    colorCache.set(k,col);res(col)}catch{res(null)}};
  img.onerror=()=>res(null);img.src=u})}

function sortTracks(arr,mode){
  const a=arr.slice();
  if(mode==='title')a.sort((x,y)=>coll.compare(x.title,y.title));
  else if(mode==='artist')a.sort((x,y)=>coll.compare(x.artist,y.artist)||coll.compare(x.album,y.album)||(x.track-y.track)||coll.compare(x.title,y.title));
  else if(mode==='album')a.sort((x,y)=>coll.compare(x.album,y.album)||(x.track-y.track)||coll.compare(x.title,y.title));
  else if(mode==='track')a.sort((x,y)=>(x.track||999)-(y.track||999)||coll.compare(x.title,y.title));
  else a.sort((x,y)=>y.added-x.added);

}

/* ================= Reproductor ================= */
function setQueue(ids,start,shuf=S.shuffle){
  S.base=ids.slice();
  if(shuf){const first=ids[start]??ids[Math.floor(Math.random()*ids.length)];S.queue=[first,...shuffleArr(ids.filter(x=>x!==first))];S.qi=0}
  else{S.queue=ids.slice();S.qi=Math.max(0,start)}
}
function playList(ids,start){if(!ids.length)return;setQueue(ids,start);loadCur(true)}
function loadCur(autoplay,startAt=0){
  const t=curT();
  if(!t){audio.pause();updateNow();return}
  if(curURL)URL.revokeObjectURL(curURL);
  curURL=URL.createObjectURL(t.blob);
  audio.src=curURL;
  if(startAt)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=startAt},{once:true});
  if(autoplay){audio.play().catch(()=>{});fadeIn()}
  updateNow();saveState();
  ensureLyrics(t);ensureCover(t).then(()=>ensureHD(t));addHistory(t.id);
}
function addHistory(id){const h=store.get('history',[]).filter(x=>x!==id);h.unshift(id);store.set('history',h.slice(0,60))}
function toggle(){if(!curT()){const ids=S.list.length?S.list:[...S.tracks.keys()];if(ids.length)playList(ids,S.shuffle?-1:0);return}audio.paused?audio.play().catch(()=>{}):audio.pause()}
function next(auto){
  if(!S.queue.length)return;S.dir=1;
  if(auto&&S.repeat==='one'){audio.currentTime=0;audio.play();return}
  if(S.qi<S.queue.length-1)S.qi++;
  else if(S.repeat==='all'){if(S.shuffle){const c=curId();S.queue=shuffleArr(S.base);if(S.queue[0]===c&&S.queue.length>1)S.queue.push(S.queue.shift())}S.qi=0}
  else{if(auto){audio.pause();audio.currentTime=0;updateNow();return}S.qi=0}
  loadCur(true);
}
function prev(){
  if(audio.currentTime>3||S.qi<=0&&S.repeat!=='all'){audio.currentTime=0;return}
  S.dir=-1;S.qi=S.qi>0?S.qi-1:S.queue.length-1;loadCur(true);
}
function toggleShuffle(){
  S.shuffle=!S.shuffle;store.set('shuffle',S.shuffle);
  const c=curId();
  if(c){if(S.shuffle){S.queue=[c,...shuffleArr(S.base.filter(x=>x!==c))];S.qi=0}else{S.queue=S.base.slice();S.qi=Math.max(0,S.queue.indexOf(c))}}
  toast(S.shuffle?'Aleatorio activado':'Aleatorio desactivado',1400);updateNow();renderQueue();saveState();
}
function cycleRepeat(){S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';store.set('repeat',S.repeat);toast({off:'Repetir desactivado',all:'Repetir todo',one:'Repetir una canción'}[S.repeat],1400);updateNow()}
function playNext(id){if(!curT()){playList([id],0);return}S.queue.splice(S.qi+1,0,id);const bi=S.base.indexOf(curId());S.base.splice(bi+1,0,id);toast('Sonará a continuación',1500);renderQueue();saveState()}
function addQueue(id){if(!curT()){playList([id],0);return}S.queue.push(id);S.base.push(id);toast('Agregada a la cola',1500);renderQueue();saveState()}

let raf=0;function tick(){if(!seeking)updateTime();lyrTick();raf=requestAnimationFrame(tick)}
audio.addEventListener('play',()=>{document.body.classList.add('playing');NCALL('setPlaybackState',{playbackState:'playing'});updatePlayIcons();if(!raf)raf=requestAnimationFrame(tick)});
audio.addEventListener('pause',()=>{document.body.classList.remove('playing');NCALL('setPlaybackState',{playbackState:'paused'});updatePlayIcons();saveState();cancelAnimationFrame(raf);raf=0;updateTime();lyrTick()});
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('error',()=>{if(!audio.src)return;toast('No se pudo reproducir este archivo; paso a la siguiente');setTimeout(()=>next(true),800)});
audio.addEventListener('loadedmetadata',async()=>{const t=curT();if(t&&(!t.duration||Math.abs(t.duration-audio.duration)>2)&&isFinite(audio.duration)){t.duration=audio.duration;try{await dbPut('tracks',t)}catch{}}updateTime();posState()});
let seeking=false,lastSave=0;

audio.addEventListener('timeupdate',()=>{if(!seeking&&!raf)updateTime();if(NMS&&Date.now()-lastPos>1000){lastPos=Date.now();posState()}if(Date.now()-lastSave>5000){lastSave=Date.now();saveState()}});

function updateTime(){

  for(const [s,cu,du] of [['#bSeek','#bCur','#bDur'],['#npSeek','#npCur','#npDur'],['#lSeek','#lCur','#lDur']]){const el=$(s);el.value=d?Math.round(c/d*1000):0;el.style.setProperty('--p',p+'%');$(cu).textContent=fmt(c);$(du).textContent=fmt(d)}
  $('#mProg').style.width=p+'%';
}

  el.addEventListener('change',()=>{const d=audio.duration||0;if(d)audio.currentTime=d*el.value/1000;seeking=false;posState()})}

const vol=$('#bVol');
function setVol(v){audio.volume=v;vol.value=v;vol.style.setProperty('--p',v*100+'%');$('#bMute').innerHTML=ic(v==0||audio.muted?'mute':'vol');store.set('vol',v)}

function updatePlayIcons(){const i=ic(audio.paused?'play':'pause');for(const s of['#bPlay','#npPlay','#mPlay','#lPlay'])$(s).innerHTML=i}
function marquee(el,text){el.classList.remove('run');el.innerHTML=`<span class="mi"><span>${esc(text)}</span></span>`;
  requestAnimationFrame(()=>{const m=el.firstChild;if(m&&m.scrollWidth>el.clientWidth+4){m.innerHTML=`<span>${esc(text)}</span><span>${esc(text)}</span>`;el.style.setProperty('--d',Math.max(8,text.length*.38)+'s');el.classList.add('run')}})}
let nowFor=null;
function updateNow(coverChanged){
  const t=curT();const changed=nowFor!==curId()||coverChanged;nowFor=curId();
  $('#bar').classList.toggle('empty-bar',!t);
  $('#bTitle').textContent=t?t.title:'Nada sonando';$('#bArtist').textContent=t?t.artist:'Elige una canción';

  $('#npArtist').textContent=t?.artist||'';
  const u=coverURL(t);
  if(lyrFor!==curId())renderLyrics();
  const f=t&&isFav(t.id);for(const s of['#bFav','#npFav']){$(s).innerHTML=ic(f?'heart':'heartO');$(s).classList.toggle('on',!!f)}

  for(const s of['#bRep','#npRep']){$(s).innerHTML=ic(S.repeat==='one'?'repeat1':'repeat');$(s).classList.toggle('on',S.repeat!=='off')}
  updatePlayIcons();updateTime();markCurrent();renderQueue();

    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:u?[{src:u,sizes:'512x512',type:t.cover.type||'image/jpeg'}]:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}catch{}
  }
}
function posState(){try{if(audio.duration&&isFinite(audio.duration)){const st={duration:audio.duration,playbackRate:audio.playbackRate||1,position:Math.min(audio.currentTime,audio.duration)};navigator.mediaSession?.setPositionState?.(st);NCALL('setPositionState',st)}}catch{}}
const artCache=new Map();
async function artData(t){
  if(!t)return null;if(!t.cover)return t.coverUrl||null;
  if(artCache.has(t.id))return artCache.get(t.id);
  try{const bmp=await createImageBitmap(t.cover);const c=document.createElement('canvas');const n=Math.min(512,bmp.width||512);c.width=c.height=n;
    c.getContext('2d').drawImage(bmp,0,0,n,n);const u=c.toDataURL('image/jpeg',.85);artCache.set(t.id,u);return u}catch{return null}
}
function nativeMeta(t){if(!NMS||!t)return;artData(t).then(src=>NCALL('setMetadata',{title:t.title,artist:t.artist,album:t.album,artwork:src?[{src,sizes:'512x512',type:'image/jpeg'}]:[]}))}
if('mediaSession' in navigator){
  const ms=navigator.mediaSession,H=(a,f)=>{try{ms.setActionHandler(a,f)}catch{}};
  H('play',()=>audio.play());H('pause',()=>audio.pause());H('previoustrack',prev);H('nexttrack',()=>next(false));
  H('seekbackward',d=>{audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10));posState()});
  H('seekforward',d=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+(d.seekOffset||10));posState()});
  H('seekto',d=>{audio.currentTime=d.seekTime;posState()});
}
if(NMS){
  const A=(a,f)=>NCALL('setActionHandler',{action:a},f);
  A('play',()=>audio.play().catch(()=>{}));A('pause',()=>audio.pause());A('previoustrack',prev);A('nexttrack',()=>next(false));
  A('seekto',d=>{if(d&&d.seekTime!=null){audio.currentTime=d.seekTime;posState()}});
  A('seekforward',d=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+((d&&d.seekOffset)||10));posState()});
  A('seekbackward',d=>{audio.currentTime=Math.max(0,audio.currentTime-((d&&d.seekOffset)||10));posState()});
  A('stop',()=>{audio.pause();NCALL('setPlaybackState',{playbackState:'none'})});

function lyricsState(t){if(!t)return{k:'none'};const L=t.lyrics;if(L?.synced)return{k:'synced',L};if(L?.plain)return{k:'plain',L};if(L?.instrumental)return{k:'instr'};if(lyrLoading.has(t.id))return{k:'loading'};return{k:'missing'}}
function renderLyrics(){
  const t=curT(),st=lyricsState(t);lyrFor=t?.id;lyrIdx=-2;
  $('#lyrTitle').textContent=t?.title||'';$('#lyrArtist').textContent=t?.artist||'';

  else if(st.k==='plain')h='<div class="lnote">Letra sin sincronizar</div>'+st.L.plain.split('\n').map(s=>`<p class="ll past" style="cursor:default">${esc(s)||'&nbsp;'}</p>`).join('');
  else if(st.k==='loading')h='<div class="lmsg">Buscando la letra…</div>';
  else if(st.k==='instr')h='<div class="lmsg">♪ Canción instrumental ♪</div>';
  else if(st.k==='none')h='<div class="lmsg">Pon una canción para ver su letra</div>';
  else h=`<div class="lmsg">No encontré la letra de esta canción<small>${online()?'':'La búsqueda por internet está apagada en Ajustes. '}Puedes poner un archivo .lrc con el mismo nombre que la canción, o pegarla tú.</small><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn" data-act="lpaste">Pegar letra</button>${online()?'<button class="btn ghost" data-act="lretry" style="color:#fff;border-color:#ffffff60">Buscar de nuevo</button>':''}</div></div>`;
  $('#lyrBody').innerHTML=h;$('#lyrBody').scrollTop=0;
  lyrTick(true);
}
function lyrCard(){
  const t=curT(),st=lyricsState(t),c=$('#lcard');
  const head=`<h4>Letra <small>${st.k==='synced'?'Ver completa ›':''}</small></h4>`;
  if(st.k==='synced'){const L=st.L.synced,i=Math.max(0,lyrIdx);c.innerHTML=head+L.slice(i,i+4).map((l,k)=>`<p class="ll ${k===0&&lyrIdx>=0?'cur':''}">${esc(l.s)||'♪'}</p>`).join('');}
  else if(st.k==='plain')c.innerHTML=head+st.L.plain.split('\n').filter(Boolean).slice(0,4).map(s=>`<p class="ll past">${esc(s)}</p>`).join('');
  else c.innerHTML=head+`<p style="margin:0;color:#ffffffc0">${st.k==='loading'?'Buscando la letra…':st.k==='instr'?'Canción instrumental':'Sin letra todavía · toca para agregarla'}</p>`;
}
function lyrTick(force){
  const t=curT();if(!t||t.id!==lyrFor){return}
  const L=t.lyrics?.synced;
  if(!L){if(force)lyrCard();return}
  const now=audio.currentTime+.2;let lo=0,hi=L.length-1,idx=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=now){idx=m;lo=m+1}else hi=m-1}
  if(idx===lyrIdx&&!force)return;
  lyrIdx=idx;
  const ps=$('#lyrBody').children;
  for(let i=0;i<ps.length;i++){ps[i].classList.toggle('past',i<idx);ps[i].classList.toggle('cur',i===idx)}
  if($('#lyr').classList.contains('open')&&Date.now()>userScrollUntil){
    const el=ps[Math.max(0,idx)],b=$('#lyrBody');
    if(el)b.scrollTo({top:el.offsetTop-b.clientHeight*.32,behavior:force?'auto':'smooth'});
  }
  lyrCard();
}

    m.hidden=false;const form=$('form',m);
    const close=v=>{m.hidden=true;m.innerHTML='';res(v)};
    form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const o=Object.fromEntries(fd);if(multi)o[multi]=fd.getAll(multi);close(o)};
    const x=$('[data-x]',m);if(x)x.onclick=()=>close(null);

function jsonp(url,ms=9000){return new Promise(res=>{const cb='__ondajp'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;
  const fin=v=>{if(done)return;done=true;try{delete window[cb]}catch{}s.remove();res(v)};
  window[cb]=d=>fin(d);s.onerror=()=>fin({__err:true});setTimeout(()=>fin({__err:true}),ms);
  s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s)})}
async function itunes(params){
  const u='https://itunes.apple.com/search?'+new URLSearchParams({media:'music',country:'MX',...params});
  let r=await fetchJSON(u);if(r&&r.__err)r=await jsonp(u);return r;
}
const artSize=(u,s)=>u?u.replace(/\/\d+x\d+(bb)?\.(jpg|png|webp)$/i,`/${s}x${s}bb.jpg`).replace(/\d+x\d+bb/,`${s}x${s}bb`):null;
function mapItunes(x){return{kind:'itunes',key:'it:'+x.trackId,title:x.trackName,artist:x.artistName,album:x.collectionName||'',art:artSize(x.artworkUrl100,400),hd:artSize(x.artworkUrl100,3000),preview:x.previewUrl,page:x.trackViewUrl,year:(x.releaseDate||'').slice(0,4),genre:x.primaryGenreName,dur:(x.trackTimeMillis||0)/1000}}
async function itunesArtistSongs(name,limit=25){
  const r=await itunes({term:name,entity:'song',attribute:'artistTerm',limit:String(limit)});
  if(!r||r.__err)return{__err:true};
  const n=norm(name);return(r.results||[]).filter(x=>{const a=norm(x.artistName);return a.includes(n.slice(0,12))||n.includes(a)});
}
async function itunesMatch(t){
  const an=knownArtist(t),ti=norm(cleanTitle(t.title));
  const r=await itunes({term:`${an} ${cleanTitle(t.title)}`.trim(),entity:'song',limit:'8'});
  if(!r||r.__err)return r||null;
  const a=norm(an);
  return(r.results||[]).find(x=>{const xt=norm(x.trackName),xa=norm(x.artistName);return(xt.includes(ti.slice(0,14))||ti.includes(xt.slice(0,14)))&&(!a||xa.includes(a.slice(0,10))||a.includes(xa))})||null;
}
async function wikiSummary(q,lang='es'){
  const s=await fetchJSON(`https://${lang}.wikipedia.org/w/api.php?`+new URLSearchParams({action:'query',list:'search',srsearch:q,srlimit:'1',format:'json',origin:'*'}));
  const title=s&&!s.__err&&s.query?.search?.[0]?.title;if(!title)return null;
  const p=await fetchJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/`+encodeURIComponent(title));
  return p&&!p.__err&&p.extract&&p.type!=='disambiguation'?p:null;
}
const wikiCache=new Map();
async function artistWiki(name){
  if(wikiCache.has(name))return wikiCache.get(name);
  let p=await wikiSummary(`${name} cantante OR banda OR músico OR grupo musical`);
  if(p&&!norm(p.title).includes(norm(name).split(' ')[0]))p=null;
  wikiCache.set(name,p);
  if(p?.thumbnail?.source){const big=p.originalimage?.source||p.thumbnail.source;S.artistPics.set(name,big)}
  return p;
}

  const res={err,it:it&&!it.__err?(it.results||[]).filter(x=>x.previewUrl).map(mapItunes):[],free:[...(jm.__err?[]:jm),...(ia.__err?[]:ia)]};
  [...res.it,...res.free].forEach(x=>S.netItems.set(x.key,x));

  const r=await fetchJSON(u);if(!r||r.__err)return{__err:true};

/* ---- Descargas de música libre ---- */
async function archiveFiles(x){
  if(x.files)return x.files;
  const m=await fetchJSON('https://archive.org/metadata/'+encodeURIComponent(x.id));
  if(!m||m.__err)return[];
  let files=(m.files||[]).filter(f=>/\.mp3$/i.test(f.name)&&!/_64kb\.mp3$/i.test(f.name));
  const vbr=files.filter(f=>/VBR MP3|MP3/i.test(f.format||''));if(vbr.length)files=vbr;
  x.files=files.slice(0,80).map(f=>({name:f.name,title:f.title||f.name.split('/').pop().replace(/\.mp3$/i,''),artist:f.creator||f.artist||x.artist,album:f.album||x.album,track:parseInt(f.track)||0,size:+f.size||0,url:`https://archive.org/download/${encodeURIComponent(x.id)}/${f.name.split('/').map(encodeURIComponent).join('/')}`}));
  return x.files;
}
async function downloadNet(k){
  const x=S.netItems.get(k);if(!x)return;
  if(x.kind==='jamendo'){if(!x.download){toast('Esta canción no permite descarga');return}return fetchAndImport(x.download,`${x.artist} - ${x.title}.mp3`,{title:x.title,artist:x.artist,album:x.album,source:'jamendo',license:x.license,page:x.page,art:x.art})}
  toast('Buscando archivos…',0);
  const files=await archiveFiles(x);$('#toast').hidden=true;
  if(!files.length){toast('No se pudo leer este elemento de Internet Archive');return}
  const meta=f=>({title:f.title,artist:f.artist,album:f.album,track:f.track,source:'archive',license:x.license,page:x.page,art:x.art});
  if(files.length===1)return fetchAndImport(files[0].url,files[0].name.split('/').pop(),meta(files[0]));
  S.pendingFiles={x,files,meta};
  modal({title:x.title,ok:'',html:`<p class="hint">${files.length} pistas · ${esc(x.artist)}</p><div style="max-height:52vh;overflow:auto">${files.map((f,i)=>`<div class="fileitem"><span class="t1" style="font-weight:500">${esc(f.title)}</span><button class="ib" data-act="dlfile" data-i="${i}" title="Descargar">${ic('dl')}</button></div>`).join('')}</div><button type="button" class="btn pri" data-act="dlall">${ic('dl')}Descargar todo</button>`});
}
async function fetchAndImport(url,name,extra){
  try{
    const r=await fetch(url);if(!r.ok)throw new Error(r.status);
    const total=+r.headers.get('content-length')||0;let chunks=[],got=0;
    const rd=r.body&&r.body.getReader?r.body.getReader():null;
    if(rd){for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;toast(`Descargando “${extra.title}” · ${total?Math.round(got/total*100)+'%':(got/1e6).toFixed(1)+' MB'}`,0)}}
    else chunks=[new Uint8Array(await r.arrayBuffer())];
    const file=new File(chunks,name.replace(/[\\/:*?"<>|]/g,'_'),{type:'audio/mpeg'});
    await importFiles([file],{quiet:true});
    const t=S.tracks.get(file.name+'|'+file.size);
    if(!t){toast('No se pudo guardar la canción');return}
    const fb=parseName(file.name).title;
    if(extra.title&&(t.title===fb||!t.title))t.title=extra.title;
    if(extra.artist&&t.artist==='Artista desconocido')t.artist=extra.artist;
    if(extra.album&&t.album==='Sin álbum')t.album=extra.album;
    if(extra.track&&!t.track)t.track=extra.track;
    Object.assign(t,{source:extra.source,license:extra.license,page:extra.page});
    if(!t.cover&&extra.art){try{const ir=await fetch(extra.art);if(ir.ok){const b=await ir.blob();if(b.type.startsWith('image/'))t.cover=b}}catch{}if(!t.cover)t.coverUrl=extra.art}
    try{await dbPut('tracks',t)}catch{}
    render();updateStorage();toast(`✓ “${t.title}” se guardó en tu biblioteca`,3000);
  }catch(e){toast('No se pudo descargar. Revisa tu conexión.',3500)}
}

async function openInfo(t){

  const box=$('#infoBody');$('#info').classList.add('open');
  const local=t.id&&S.tracks.get(t.id);

/* Gestos sobre la portada: deslizar ↑ cambia estilo · ←/→ cambia canción · mantener presionado y lanzar ↑ la manda a otro dispositivo */
(function(){
  const st=$('#npStage');let sx=0,sy=0,t0=0,dx=0,dy=0,active=false,holdT=null;
  const item=()=>$('#npSlot').lastElementChild;
  st.addEventListener('pointerdown',e=>{if(e.button>0)return;active=true;S.grabbed=false;sx=e.clientX;sy=e.clientY;t0=Date.now();dx=dy=0;try{st.setPointerCapture(e.pointerId)}catch{}
    clearTimeout(holdT);holdT=setTimeout(()=>{if(active&&Math.hypot(dx,dy)<14){S.grabbed=true;st.classList.add('grab');try{navigator.vibrate&&navigator.vibrate(30)}catch{}const it=item();if(it)it.style.transform='scale(1.06)';
      if(!CONN.conns.size)toast('Lánzala hacia arriba para mandarla a otro dispositivo',2200)}},380)});
  st.addEventListener('pointermove',e=>{if(!active)return;dx=e.clientX-sx;dy=e.clientY-sy;const it=item();if(!it)return;
    if(S.grabbed){it.style.transform=`translate(${dx*.5}px,${dy}px) scale(${1.06-Math.min(.3,Math.max(0,-dy)/900)}) rotate(${dx*.03}deg)`;$('#npConn').classList.toggle('hot',dy<-110)}
    else if(Math.abs(dy)>Math.abs(dx)&&dy<0)it.style.transform=`translateY(${dy*.35}px)`;
    else if(Math.abs(dx)>Math.abs(dy))it.style.transform=`translateX(${dx*.4}px) rotate(${dx*.02}deg)`});
  const back=it=>{if(!it)return;const from=it.style.transform||'none';it.style.transform='';it.animate([{transform:from},{transform:'none'}],{duration:420,easing:'cubic-bezier(.3,1.5,.5,1)'})};
  const end=()=>{if(!active)return;active=false;clearTimeout(holdT);const it=item(),dt=Date.now()-t0;st.classList.remove('grab');$('#npConn').classList.remove('hot');
    if(S.grabbed){
      if(dy<-110){
        if(!CONN.conns.size){back(it);openConnect();}
        else{const from=it.style.transform;it.animate([{transform:from,opacity:1},{transform:'translateY(-120vh) scale(.35) rotate(-12deg)',opacity:.3}],{duration:480,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).onfinish=()=>{it.style.transform='';renderStage(false)};sendCurrent()}
      }else back(it);
    }else if(dy<-60&&Math.abs(dy)>Math.abs(dx)*1.3&&dt<800){it&&(it.style.transform='');cycleStyle(1)}
    else if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<800){it&&(it.style.transform='');if(dx<0)next(false);else{S.dir=-1;prev()}}
    else back(it);
    setTimeout(()=>{S.grabbed=false},50)};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('dragstart',e=>e.preventDefault());st.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ================= Onda Connect: pasar canciones entre celular y computadora ================= */
const CONN={peer:null,conns:new Map(),ready:false,loading:null};
const myCode=()=>{let c=store.get('devcode',null);if(!c){c=String(Math.floor(100000+Math.random()*900000));store.set('devcode',c)}return c};
const isMobile=()=>IS_NATIVE||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const myName=()=>store.get('devname','')||(isMobile()?'Celular':'Computadora');
function loadPeerJS(){
  if(window.Peer)return Promise.resolve();if(CONN.loading)return CONN.loading;
  CONN.loading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>{CONN.loading=null;s.remove();rej(new Error('net'))};document.head.appendChild(s)});
  return CONN.loading;
}
async function startConnect(){
  if(CONN.peer&&!CONN.peer.destroyed&&CONN.ready)return true;
  try{await loadPeerJS()}catch{return false}
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    const p=new Peer('onda-'+myCode(),{debug:0});CONN.peer=p;
    p.on('open',()=>{CONN.ready=true;fin(true);updateConnUI();store.get('peers',[]).forEach(d=>connectTo(d.code,true))});
    p.on('connection',c=>setupConn(c));
    p.on('disconnected',()=>{CONN.ready=false;setTimeout(()=>{try{if(!p.destroyed)p.reconnect()}catch{}},2000)});
    p.on('error',err=>{
      if(err.type==='unavailable-id'){store.set('devcode',null);p.destroy();CONN.peer=null;startConnect().then(fin)}
      else if(err.type==='peer-unavailable'){updateConnUI();if(S.connWait){toast('Ese dispositivo no está conectado. Abre Onda en él.',3500);S.connWait=false}}
      else if(!CONN.ready)fin(false);
    });
    setTimeout(()=>fin(false),12000);
  });
}
function connectTo(code,silent){
  code=String(code||'').replace(/\D/g,'');if(code.length!==6||code===myCode()||!CONN.peer)return;
  if(CONN.conns.has('onda-'+code))return;
  if(!silent)S.connWait=true;
  const c=CONN.peer.connect('onda-'+code,{reliable:true,serialization:'binary'});c.__silent=silent;setupConn(c);
}
function setupConn(c){
  c.on('open',()=>{CONN.conns.set(c.peer,c);c.send({t:'hello',name:myName(),code:myCode()});updateConnUI()});
  c.on('data',d=>onPeerData(c,d));
  const gone=()=>{if(CONN.conns.get(c.peer)===c)CONN.conns.delete(c.peer);updateConnUI()};
  c.on('close',gone);c.on('error',gone);
}
const pendingSend=new Map();
async function onPeerData(c,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'){c.__name=d.name;S.connWait=false;const peers=store.get('peers',[]);const ex=peers.find(p=>p.code===d.code);if(ex)ex.name=d.name;else peers.push({code:d.code,name:d.name});store.set('peers',peers);
    if(!c.__silent)toast(`Conectado con ${d.name} ✓`,2500);updateConnUI();if(!$('#modal').hidden&&$('#modal .devs'))openConnect(true);return}
  if(d.t==='offer'){c.send({t:'need',id:d.id,need:!S.tracks.has(d.id)});return}
  if(d.t==='need'){const p=pendingSend.get(d.id);if(p){pendingSend.delete(d.id);p(d.need)}return}
  if(d.t==='song'){receiveSong(c,d);return}
  if(d.t==='ack'){toast(`Ahora suena en ${c.__name||'el otro dispositivo'} 🎶`,2600);return}
}
async function sendCurrent(){
  const t=curT();const c=[...CONN.conns.values()].find(c=>c.open);if(!t||!c)return;
  toast(`Enviando a ${c.__name||'otro dispositivo'}…`,0);
  const need=await new Promise(res=>{pendingSend.set(t.id,res);try{c.send({t:'offer',id:t.id})}catch{res(true)}setTimeout(()=>{if(pendingSend.has(t.id)){pendingSend.delete(t.id);res(true)}},6000)});
  const msg={t:'song',meta:{id:t.id,file:t.file,title:t.title,artist:t.artist,album:t.album,track:t.track||0,duration:t.duration||0,lyrics:t.lyrics||null,coverUrl:t.coverUrl||null,hd:t.hd||null},time:audio.currentTime,playing:!audio.paused};
  try{
    if(need){msg.data=await t.blob.arrayBuffer();msg.mime=t.blob.type||'audio/mpeg';if(t.cover){msg.cover=await t.cover.arrayBuffer();msg.coverMime=t.cover.type||'image/jpeg'}}
    c.send(msg);audio.pause();
  }catch{toast('No se pudo enviar la canción')}
}
async function receiveSong(c,d){
  const m=d.meta;let t=S.tracks.get(m.id);
  if(!t){
    if(!d.data){toast('Llegó una canción incompleta, intenta otra vez');return}
    t={...m,blob:new Blob([d.data],{type:d.mime||'audio/mpeg'}),cover:d.cover?new Blob([d.cover],{type:d.coverMime||'image/jpeg'}):null,added:Date.now(),from:c.__name||''};
    try{await dbPut('tracks',t)}catch{toast('No hay espacio para guardar la canción');return}
    S.tracks.set(t.id,t);
  }
  if(curT()){S.queue.splice(S.qi+1,0,t.id);S.base.push(t.id);S.qi++}else{S.base=[t.id];S.queue=[t.id];S.qi=0}
  S.dir=-1;loadCur(d.playing!==false,d.time||0);openNP();
  $('#np').classList.add('incoming');setTimeout(()=>$('#np').classList.remove('incoming'),900);
  render();toast(`🎵 “${t.title}” llegó desde ${c.__name||'otro dispositivo'}`,3500);
  try{c.send({t:'ack'})}catch{}
}
function updateConnUI(){
  const live=[...CONN.conns.values()].filter(c=>c.open);
  $$('[data-act=connect].ib').forEach(b=>b.classList.toggle('live',live.length>0));
  const nc=$('#npConn');
  if(live.length){nc.hidden=false;nc.innerHTML=`<span class="dot"></span>Conectado a ${esc(live[0].__name||'otro dispositivo')} · mantén presionada la portada y lánzala ↑`}
  else nc.hidden=true;
}
async function openConnect(refresh){
  if(!refresh){toast('Conectando…',0)}
  const ok=await startConnect();$('#toast').hidden=true;
  if(!ok){modal({title:'Onda Connect',ok:'',html:'<p class="hint">Para pasar canciones entre tu celular y tu computadora, los dos necesitan internet y tener Onda abierta. Revisa tu conexión e inténtalo de nuevo.</p>'});return}
  const peers=store.get('peers',[]);

    <label>Código del otro dispositivo<input name="code" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="off"></label>
    ${peers.length?`<div class="devs">${peers.map(p=>`<div class="dev"><i class="st${live.has('onda-'+p.code)?' on':''}"></i>${esc(p.name)} <small style="color:var(--tx3)">${p.code}</small><button type="button" data-act="forgetdev" data-code="${p.code}">Olvidar</button></div>`).join('')}</div>`:''}
    <p class="hint">Cuando estén conectados, abre <b>Reproduciendo</b>, <b>mantén presionada la portada</b> y <b>lánzala hacia arriba</b>: la canción se pasa al otro dispositivo y sigue sonando en el mismo segundo. La próxima vez se conectan solos.</p>`});
  if(r&&r.code)connectTo(r.code,false);

  if(!ts.length){toast('Primero agrega música a tu biblioteca');return}
  const r=await modal({title:`Agregar a “${p.name}”`,ok:'Agregar',html:`<input type="search" placeholder="Buscar en tu biblioteca" oninput="const q=this.value.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();this.nextElementSibling.querySelectorAll('label').forEach(l=>l.style.display=l.dataset.s.includes(q)?'':'none')" style="margin-bottom:4px">
    <div class="pick">${ts.map(t=>`<label data-s="${esc(norm(t.title+' '+t.artist))}"><input type="checkbox" name="s" value="${esc(t.id)}" ${p.ids.includes(t.id)?'checked disabled':''}>${coverHTML(t,'')}<div style="min-width:0"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist)}</div></div></label>`).join('')}</div>`,multi:'s'});
  if(!r||!r.s||!r.s.length)return;
  for(const id of r.s)if(!p.ids.includes(id))p.ids.push(id);
  await savePl(p);render();toast(`${r.s.length} ${r.s.length===1?'canción agregada':'canciones agregadas'}`,1800);
}

/* ================= Arranque ================= */
(function staticIcons(){
  $$('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic)));
})();
applyTheme();
(async function init(){
  try{db=await openDB()}catch(e){$('#content').innerHTML='<div class="empty"><h2>No se pudo abrir el almacenamiento</h2><p>Tu navegador no permite guardar datos aquí (¿modo incógnito?). Abre Onda en una ventana normal.</p></div>';return}
  const [ts,pls]=await Promise.all([dbAll('tracks'),dbAll('playlists')]);
  ts.forEach(t=>S.tracks.set(t.id,t));pls.forEach(p=>S.pls.set(p.id,p));
  if(!S.pls.has('__fav'))await savePl({id:'__fav',name:'Favoritas',ids:[],created:0});
  setVol(store.get('vol',1));
  const st=store.get('state',null);
  if(st&&st.queue?.length){S.queue=st.queue.filter(id=>S.tracks.has(id));S.base=(st.base||st.queue).filter(id=>S.tracks.has(id));
    const id=st.queue[st.qi];S.qi=S.queue.indexOf(id);if(S.qi<0&&S.queue.length)S.qi=0;if(S.qi>=0)loadCur(false,st.time||0)}
  render();updateNow();renderStage(false);updateStorage();renderLyrics();setTimeout(queueMissingCovers,3000);
  if(store.get('peers',[]).length&&navigator.onLine)setTimeout(()=>startConnect().then(updateConnUI),1500);
  setInterval(()=>{if(store.get('theme','auto')==='auto'&&seasonOf()!==THEME.key){applyTheme();render()}},36e5);
  if(!IS_APP&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
